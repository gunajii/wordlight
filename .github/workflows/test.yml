name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg python3-numpy
      - run: npm ci
      - run: npm run typecheck
      - name: npm test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt || { grep -E "not ok|code: |message: |ERR_" test-output.txt | head -9 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
